<!DOCTYPE html>
<html>
<head>
    <title>To-Do List App</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            padding: 40px;
        }
        #todo-box {
            width: 350px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        input {
            width: 75%;
            padding: 8px;
        }
        button {
            padding: 8px 12px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
        li {
            list-style: none;
            padding: 10px;
            background: #eee;
            margin-top: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
        }
        .done {
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>
<body>

<div id="todo-box">
    <h2>To-Do List</h2>
    <input type="text" id="taskInput" placeholder="Enter task">
    <button onclick="addTask()">Add</button>

    <ul id="taskList"></ul>
</div>

<script>
    function loadTasks() {
        const saved = JSON.parse(localStorage.getItem("tasks")) || [];
        saved.forEach(text => addTask(text, true));
    }

    function addTask(text = null, loading = false) {
        let taskText = text || document.getElementById("taskInput").value;
        if (taskText === "") return;

        const li = document.createElement("li");

        li.innerHTML = `
            <span onclick="this.classList.toggle('done')">${taskText}</span>
            <button onclick="this.parentElement.remove(); saveTasks()">X</button>
        `;

        document.getElementById("taskList").appendChild(li);
        document.getElementById("taskInput").value = "";

        if (!loading) saveTasks();
    }

    function saveTasks() {
        let tasks = [];
        document.querySelectorAll("#taskList span").forEach(item => {
            tasks.push(item.textContent);
        });
        localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    loadTasks();
</script>

</body>
</html>
